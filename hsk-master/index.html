    <script>
      // Suppress benign Vite HMR WebSocket connection errors in AI Studio iframe environment
      (function() {
        if (typeof window !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('vite') || url.includes('.run.app') || url.includes('token=')))
              ) {
                var ws = new EventTarget();
                ws.url = url;
                ws.protocols = protocols;
                ws.readyState = 1;
                ws.bufferedAmount = 0;
                ws.extensions = '';
                ws.protocol = protocols || '';
                ws.binaryType = 'blob';
                ws.send = function() {};
                ws.close = function() { ws.readyState = 3; };
                setTimeout(function() {
                  var evt = new Event('open');
                  ws.dispatchEvent(evt);
                  if (typeof ws.onopen === 'function') ws.onopen(evt);
                }, 5);
                return ws;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          var origConsoleError = console.error;
          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var str = (arg && (arg.message || arg.stack || String(arg))) || '';
              if (
                str.includes('WebSocket closed without opened') ||
                (str.includes('WebSocket') && str.includes('[vite]'))
              ) {
                return;
              }
            }
            return origConsoleError.apply(console, arguments);
          };

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (msg.includes('WebSocket closed without opened') || msg.includes('vite-hmr')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = String((event && (event.reason && (event.reason.message || event.reason))) || '');
            if (reason.includes('WebSocket closed without opened') || reason.includes('vite-hmr')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
