<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46" />
      <stop offset="100%" stop-color="#1B3B2D" />
    </linearGradient>
  </defs>
  
  <!-- Full bleed background for Android maskable icon clipping -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Safe zone inner elements (centered inside central 80% circle, safe from circular/squircle cuts) -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#254C3A" stroke="#84AC92" stroke-width="6" stroke-dasharray="12 8" />

  <!-- Main Chinese Character: 汉 (Hàn) -->
  <text x="256" y="245" font-family="'Noto Serif SC', 'KaiTi', 'SimSun', serif" font-size="180" font-weight="900" fill="#FAFBF9" text-anchor="middle" dominant-baseline="central">汉</text>

  <!-- Subtitle Tag: HSK -->
  <rect x="176" y="340" width="160" height="36" rx="8" fill="#E8EFEA" />
  <text x="256" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="#1B3B2D" letter-spacing="2" text-anchor="middle" dominant-baseline="central">HSK MASTER</text>
</svg>
