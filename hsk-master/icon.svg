<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46" />
      <stop offset="100%" stop-color="#1B3B2D" />
    </linearGradient>
    <radialGradient id="sealGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4E836A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1B3B2D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#sealGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#60977B" stroke-width="6" stroke-opacity="0.4" />

  <!-- Chinese Traditional Seal Stamp Frame -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="#254C3A" stroke="#84AC92" stroke-width="8" stroke-dasharray="14 10" />

  <!-- Main Chinese Character: 汉 (Hàn) -->
  <text x="256" y="295" font-family="'Noto Serif SC', 'KaiTi', 'SimSun', serif" font-size="210" font-weight="900" fill="#FAFBF9" text-anchor="middle" dominant-baseline="central">汉</text>

  <!-- Subtitle Tag: HSK MASTER -->
  <rect x="146" y="375" width="220" height="42" rx="10" fill="#E8EFEA" />
  <text x="256" y="398" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#1B3B2D" letter-spacing="3" text-anchor="middle" dominant-baseline="central">HSK MASTER</text>
</svg>
